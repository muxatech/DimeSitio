<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invitación a DimeSitio</title>
</head>
<body style="margin:0;padding:0;background-color:#fafaf9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#fafaf9;">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" width="100%" style="max-width:480px;background-color:#ffffff;border-radius:16px;overflow:hidden;">
          <tr>
            <td style="padding:32px 24px 0;text-align:center;">
              <h1 style="margin:0;font-size:24px;font-weight:700;color:#1c1917;letter-spacing:-0.02em;">DimeSitio</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:24px 24px 8px;text-align:center;">
              <p style="margin:0;font-size:15px;color:#44403c;line-height:1.5;">
                Has sido invitado a gestionar tu restaurante en
                <strong style="color:#1c1917;">DimeSitio</strong>.
              </p>
              <p style="margin:12px 0 0;font-size:14px;color:#57534e;line-height:1.5;">
                Crea tu cuenta para empezar a gestionar tu restaurante.
              </p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:24px;">
              <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 32px;background-color:#292524;color:#ffffff;font-size:15px;font-weight:600;text-decoration:none;border-radius:16px;">
                Crear mi cuenta
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding:0 24px 8px;text-align:center;">
              <p style="margin:0;font-size:12px;color:#a8a29e;">
                Si no esperabas esta invitación, ignora este email.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:24px;text-align:center;border-top:1px solid #e7e5e4;">
              <p style="margin:0;font-size:12px;color:#a8a29e;">
                &copy; 2026 DimeSitio &mdash; Valencia
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
